<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모바일 미리보기</title>
<style>
  html,body{margin:0;padding:0;background:#2b2b2b}
  .wrap{display:flex;justify-content:center;padding:0}
  iframe{width:390px;height:844px;border:0;background:#fff8ec;display:block}
</style>
</head>
<body>
<div class="wrap"><iframe id="f" src="./index.html?preview=mobile"></iframe></div>
<script>
  var f = document.getElementById('f');
  f.addEventListener('load', function () {
    setTimeout(function () {
      try {
        var w = f.contentWindow, d = w.document;
        var target = new URLSearchParams(location.search).get('anchor') || 'heatHost';
        var el = d.getElementById(target) || d.querySelector('.card');
        var y = el.getBoundingClientRect().top + w.scrollY - 12;
        w.scrollTo(0, Math.max(0, Math.round(y)));
        document.title = 'mobile-preview y=' + Math.round(y);
      } catch (e) { document.title = 'mobile-preview error: ' + e.message; }
    }, 700);
  });
</script>
</body>
</html>
